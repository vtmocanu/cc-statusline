name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Codeberg-hosted runner labels: codeberg-tiny / codeberg-small / codeberg-medium
# Default container image: ghcr.io/catthehacker/ubuntu:act-latest (Ubuntu, GitHub-Actions-compatible)
# https://codeberg.org/actions/meta

jobs:
  ci:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends shellcheck jq perl bash coreutils

      - name: bash -n (syntax check)
        run: |
          set -e
          for f in statusline.sh claude-status-fetch.sh install.sh hooks/session-topic-capture.sh tests/run-tests.sh; do
            [ -f "$f" ] || continue
            echo "==> bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          set -e
          for f in statusline.sh claude-status-fetch.sh install.sh hooks/session-topic-capture.sh tests/run-tests.sh; do
            [ -f "$f" ] || continue
            echo "==> shellcheck $f"
            shellcheck -x -S warning "$f"
          done

      - name: Run test harness
        run: bash tests/run-tests.sh

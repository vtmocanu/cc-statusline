name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: bash -n (syntax check)
        run: |
          set -e
          for f in statusline.sh claude-status-fetch.sh install.sh hooks/session-topic-capture.sh tests/run-tests.sh; do
            [ -f "$f" ] || continue
            echo "==> bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          set -e
          for f in statusline.sh claude-status-fetch.sh install.sh hooks/session-topic-capture.sh tests/run-tests.sh; do
            [ -f "$f" ] || continue
            echo "==> shellcheck $f"
            shellcheck -x -S warning "$f"
          done

      - name: Run test harness
        run: bash tests/run-tests.sh

      - name: Run test harness (broken locale)
        run: LC_ALL=C bash tests/run-tests.sh

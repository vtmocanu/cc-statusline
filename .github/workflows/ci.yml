name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Taskfile.yml includes the reusable shell.yml from github.com/vtmocanu/task
      # over https in CI; remote Taskfiles are an experimental Task feature behind
      # this flag, and `task --yes` auto-confirms the one-time remote-trust prompt.
      TASK_X_REMOTE_TASKFILES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: bash -n (syntax check)
        run: task --yes shell:syntax

      - name: shellcheck
        run: task --yes shell:lint

      - name: Run test harness
        run: task --yes test

      - name: Run test harness (broken locale)
        run: task --yes test-c-locale

      - name: Run fetcher tests
        run: task --yes test-fetch

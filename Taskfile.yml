---
# Taskfile for cc-statusline. CI (.github/workflows/ci.yml) runs these same
# tasks; run `task ci` locally before committing (see CLAUDE.md).
#
# Shell validation (syntax + shellcheck) comes from the reusable shell.yml in
# github.com/vtmocanu/task: local checkout while developing, public raw URL in
# CI. Remote includes are experimental Task behavior: CI sets
# TASK_X_REMOTE_TASKFILES=1 and uses `task --yes`.
version: "3"

vars:
  TASK_REPO_LOCAL: ~/stuff/gitrepos/gh/vtmocanu/task
  TASK_REPO_RAW: https://raw.githubusercontent.com/vtmocanu/task/main

includes:
  shell:
    taskfile: "{{if .CI}}{{.TASK_REPO_RAW}}/shell.yml{{else}}{{.TASK_REPO_LOCAL}}/shell.yml{{end}}"
    vars:
      SCRIPTS: statusline.sh claude-status-fetch.sh install.sh hooks/session-topic-capture.sh tests/run-tests.sh tests/run-fetch-tests.sh

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run the fixture test harness
    cmds:
      - bash tests/run-tests.sh

  test-c-locale:
    desc: Run the test harness under LC_ALL=C (locale regression guard, see CHANGELOG v2.1.3)
    cmds:
      - LC_ALL=C bash tests/run-tests.sh

  test-fetch:
    desc: Run the service-status fetcher tests (decision logic, fail-closed, injection safety)
    cmds:
      - bash tests/run-fetch-tests.sh
      - LC_ALL=C bash tests/run-fetch-tests.sh

  ci:
    desc: Full validation (shell syntax + lint + tests + C-locale tests + fetcher tests)
    cmds:
      - task: shell:check
      - task: test
      - task: test-c-locale
      - task: test-fetch
